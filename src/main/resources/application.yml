spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/nexosalud}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/nexosalud}
    user: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  application:
    name: employees-service

jwt:
  secret: ${JWT_SECRET:test-secret-key-for-testing-purposes-only-12345678}
  reset-password-expiration: 3600000

email:
  from: ${EMAIL_FROM:nexosalud@nexosalud.com}
  reset-password:
    subject: ${EMAIL_RESET_PASSWORD_SUBJECT:Recuperación de Contraseña - Nexo Salud}
    text: ${EMAIL_RESET_PASSWORD_TEXT:Estimado usuario, para recuperar su contraseña haga clic en el siguiente enlace:}
    website: ${EMAIL_RESET_PASSWORD_WEBSITE:https://nexosalud.com/reset-password}

logging:
  level:
    org.springframework.data.r2dbc: Debug

server:
  port: ${SERVER_PORT:8082}

---
spring:
  config:
    activate:
      on-profile: test
  r2dbc:
    url: r2dbc:h2:mem:///test?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    name: sa
    password:
  application:
    name: employees-service
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25

jwt:
  secret: test-secret-key-for-testing-purposes-only-12345678
  reset-password-expiration: 3600000

email:
  from: test@nexosalud.com
  reset-password:
    subject: Test - Recuperación de Contraseña
    text: Test email for password reset
    website: http://localhost:3000/reset-password

server:
  port: 8082

---
spring:
  config:
    activate:
      on-profile: prod
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/nexosalud}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/nexosalud}
    user: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  application:
    name: employees-service

management:
  health:
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET:test-secret-key-for-testing-purposes-only-12345678}
  reset-password-expiration: 3600000

email:
  from: ${EMAIL_FROM:nexosalud@nexosalud.com}
  reset-password:
    subject: ${EMAIL_RESET_PASSWORD_SUBJECT:Recuperación de Contraseña - Nexo Salud}
    text: ${EMAIL_RESET_PASSWORD_TEXT:Estimado usuario, para recuperar su contraseña haga clic en el siguiente enlace:}
    website: ${EMAIL_RESET_PASSWORD_WEBSITE:https://nexosalud.com/reset-password}

server:
  port: ${SERVER_PORT:8082}
